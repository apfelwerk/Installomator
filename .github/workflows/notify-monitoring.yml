name: Notify Monitoring on Installomator.sh Change

on:
  push:
    branches:
      - main
    paths:
      - Installomator.sh

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Send repository_dispatch to InstallomatorMonitoring
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.MONITORING_PAT }}
          script: |
            await github.rest.repos.createDispatchEvent({
              owner: 'owner',
              repo: 'InstallomatorMonitoring',
              event_type: 'installomator-updated',
            });
